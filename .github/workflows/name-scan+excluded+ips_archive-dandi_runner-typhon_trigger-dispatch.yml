name: Scan DANDI extraction cache for excluded IPs

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: "/mnt/s3-logs/dandi-s3-logs"

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    steps:
      - name: Cancel if offline
        uses: CodyCBakerPhD/check-runner-action@v1
        with:
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  ScanExcludedIps:
    needs: CheckTyphon
    name: Scan for excluded IPs
    runs-on: [self-hosted, typhon, dandi]
    timeout-minutes: 7200  # 5 days, the documented maximum for self-hosted runners

    steps:
      # Fails when the cache still holds requests from an address in `~/.s3-log-extraction/excluded_ips.txt`, such as
      # those extracted before it was listed, which sends the email below. The addresses themselves are never printed.
      # Runs through the default `s3logextraction` entrypoint, which `dandis3logextraction` does not re-expose.
      - name: Scan extraction cache
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v3
        with:
          command: validate excluded
          flags: --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --encryption false
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv

  NotifyOnFailure:
    # A job that times out, or waits a day in the queue for the runner, ends as cancelled rather than failed
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    needs: [CheckTyphon, ScanExcludedIps]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI excluded IP scan failed (Typhon)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The scan of the DANDI extraction cache found records of excluded IPs, or could not complete.
            Check the object keys it lists at
            https://github.com/brain-bbqs-runners/dandi-usage-runner/actions/workflows/name-scan+excluded+ips_archive-dandi_runner-typhon_trigger-dispatch.yml
