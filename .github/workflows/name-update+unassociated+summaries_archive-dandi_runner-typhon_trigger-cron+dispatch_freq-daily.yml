name: Update unassociated DANDI summaries

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: "/mnt/s3-logs/dandi-s3-logs"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  # Requesters are geolocated while the summaries are generated, against the GeoLite2 database
  MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
  MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Cancel if offline
        uses: CodyCBakerPhD/check-runner-action@v1
        with:
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateDandiSummaries:
    needs: CheckTyphon
    name: Update DANDI summaries
    runs-on: [self-hosted, typhon, dandi]
    timeout-minutes: 7200  # 5 days, the documented maximum for self-hosted runners

    steps:
      - name: Generate unassociated summaries
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v3
        with:
          command: update summaries
          flags: --unassociated --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv
          entrypoint: 'dandis3logextraction'

  NotifyOnFailure:
    # A job that times out, or waits a day in the queue for the runner, ends as cancelled rather than failed
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    needs: [CheckTyphon, UpdateDandiSummaries]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI unassociated usage summaries update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/brain-bbqs-runners/dandi-usage-runner/actions/workflows/name-update+unassociated+summaries_archive-dandi_runner-typhon_trigger-cron+dispatch_freq-daily.yml
