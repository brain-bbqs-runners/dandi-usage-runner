name: Update log inventory
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  S3_LOG_BASE_PATH: ${{ vars.DANDI_S3_LOG_BASE_PATH }}
  ENV_PATH: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/${{ vars.S3LOGS_ENV_NAME }}"

jobs:

  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Validate required variables
        run: |
          [ -n "${{ vars.DANDI_S3_LOG_BASE_PATH }}" ] || { echo "Repository variable DANDI_S3_LOG_BASE_PATH must be set."; exit 1; }
          [ -n "${{ vars.S3LOGS_ENV_NAME }}" ] || { echo "Repository variable S3LOGS_ENV_NAME must be set."; exit 1; }

      - name: Cancel if offline
        uses: CodyCBakerPhD/check-runner-action@v1
        with:
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateLogInventory:
    needs: CheckTyphon
    name: Update log inventory
    runs-on: [self-hosted, typhon, dandi]

    steps:
      - name: Update log inventory
        working-directory: ${{ env.S3_LOG_BASE_PATH }}
        run: |
          source ${{ env.ENV_PATH }}/bin/activate
          s5cmd sync --size-only 's3://dandiarchive-inventory/dandiarchive-logs/LogsWeeklyInventory/*' inventory/

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, UpdateLogInventory]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Update log inventory failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The scheduled run of S3 log inventory updates encountered an issue, please check status at
            https://github.com/brain-bbqs-runners/dandi-usage-runner/actions/workflows/name-update+logs+inventory_archive-dandi_freq-weekly.yml
