# Manual install/upgrade of the extraction packages in the DANDI runner environment.
#
# The recurring pipelines deliberately do not install anything, so that a scheduled run never picks up
# a new version mid-flight. Dispatch this workflow when the pinned revisions below need to be rolled out.
name: Install DANDI extraction packages

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: ${{ vars.DANDI_S3_LOG_BASE_PATH }}
  ENV_PATH: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/${{ vars.S3LOGS_ENV_NAME }}"
  UV_PATH: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/uv"
  FLOCK_FILE: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock"

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate required variables
        run: |
          [ -n "${{ vars.DANDI_S3_LOG_BASE_PATH }}" ] || { echo "Repository variable DANDI_S3_LOG_BASE_PATH must be set."; exit 1; }
          [ -n "${{ vars.S3LOGS_ENV_NAME }}" ] || { echo "Repository variable S3LOGS_ENV_NAME must be set."; exit 1; }

      - name: Cancel if offline
        uses: CodyCBakerPhD/check-runner-action@v1
        with:
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  InstallPackages:
    needs: CheckTyphon
    name: Install packages
    runs-on: [self-hosted, typhon, dandi]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install packages
        uses: ./.github/actions/install-s3logextraction
        with:
          flock_file: ${{ env.FLOCK_FILE }}

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, InstallPackages]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI extraction package install failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The manual package install encountered an issue, please check status at
            https://github.com/brain-bbqs-runners/dandi-usage-runner/actions/workflows/name-install+packages_archive-dandi_runner-typhon_trigger-dispatch.yml
