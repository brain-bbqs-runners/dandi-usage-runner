name: Update DANDI summaries

on:
  schedule:
    - cron: "0 6 * * 0/3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: "/mnt/s3-logs/dandi-s3-logs"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  # Requesters are geolocated while the summaries are generated, against the GeoLite2 database
  MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
  MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Validate required secrets
        run: |
          [ -n "$MAXMIND_ACCOUNT_ID" ] || { echo "Repository secret MAXMIND_ACCOUNT_ID must be set."; exit 1; }
          [ -n "$MAXMIND_LICENSE_KEY" ] || { echo "Repository secret MAXMIND_LICENSE_KEY must be set."; exit 1; }

      - name: Cancel if offline
        uses: CodyCBakerPhD/check-runner-action@v1
        with:
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateDandiSummaries:
    needs: CheckTyphon
    name: Update DANDI summaries
    runs-on: [self-hosted, typhon, dandi]
    timeout-minutes: 2880  # 48 hours

    steps:
      - name: Generate Dandiset summaries
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v2
        with:
          command: update summaries
          flags: --skip 000108 --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv
          entrypoint: 'dandis3logextraction'

      - name: Generate archive summaries
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v2
        with:
          command: update summaries
          flags: --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --mode archive --asset-types-in-order Neurophysiology,Microscopy,Video,Miscellaneous
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv

      # Reads the region labels out of the published `by_region.tsv` files, so it has to follow the summaries.
      # Runs through the default `s3logextraction` entrypoint, which `dandis3logextraction` does not re-expose.
      - name: Update region coordinates
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v2
        with:
          command: update ip coordinates --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --encryption false
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv

      - name: Generate Dandiset totals
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v2
        with:
          command: update totals
          flags: --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv

      - name: Generate archive totals
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v2
        with:
          command: update totals
          flags: --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --mode archive
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv

      - name: Upload summaries
        uses: CodyCBakerPhD/dandi-s3-logs-action/upload-summaries@v2
        with:
          extraction-cache-path: ${{ env.S3_LOG_BASE_PATH }}/extraction_cache
          repository-path: ${{ env.S3_LOG_BASE_PATH }}/access-summaries

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, UpdateDandiSummaries]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI access summaries update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/brain-bbqs-runners/dandi-usage-runner/actions/workflows/name-update+summaries_archive-dandi_runner-typhon_trigger-cron+dispatch_freq-daily.yml
