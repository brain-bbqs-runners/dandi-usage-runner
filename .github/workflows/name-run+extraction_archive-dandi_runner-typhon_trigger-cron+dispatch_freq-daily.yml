name: Run DANDI log extraction

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: "/mnt/s3-logs/dandi-s3-logs"
  IPS_TO_SKIP: ${{ secrets.IPS_TO_SKIP }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      # The extractor reads this as a regex of requester IPs to drop, and an empty regex matches every IP,
      # so a run without it would silently extract nothing.
      - name: Validate required secrets
        run: |
          [ -n "$IPS_TO_SKIP" ] || { echo "Repository secret IPS_TO_SKIP must be set: a regex of requester IPs to drop, or ^$ to drop none."; exit 1; }

      - name: Cancel if offline
        uses: CodyCBakerPhD/check-runner-action@v1
        with:
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  ProcessAccessLogs:
    needs: CheckTyphon
    name: Process access logs
    runs-on: [self-hosted, typhon, dandi]
    timeout-minutes: 2880  # 48 hours

    steps:
      # The extraction downloads each batch of raw logs into a temporary directory, and restic writes its pack
      # files to one, so both are pointed at the base path rather than /tmp through TMPDIR. The directory has to
      # exist, since Python falls back to /tmp without saying so when TMPDIR names a missing one.
      - name: Create temporary directory
        run: mkdir -p ${{ env.S3_LOG_BASE_PATH }}/tmp

      - name: Run primary S3 log extraction
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v3
        env:
          DUCT_OUTPUT_PREFIX: "${{ env.S3_LOG_BASE_PATH }}/extraction_cache/.duct/{datetime}"
          TMPDIR: "${{ env.S3_LOG_BASE_PATH }}/tmp"
        with:
          command: extract s3://dandiarchive-logs
          flags: --mode remote --inventory ${{ env.S3_LOG_BASE_PATH }}/inventory --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --limit 1000000
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv
          entrypoint: 'dandis3logextraction'

      - name: Take snapshot for backup
        working-directory: ${{ env.S3_LOG_BASE_PATH }}/
        env:
          TMPDIR: "${{ env.S3_LOG_BASE_PATH }}/tmp"
        run: ./snapshots/restic backup ./extraction_cache --repo ./snapshots/backups/ --password-file ./snapshots/.restic-password --read-concurrency 16 --pack-size 128 --compression max --skip-if-unchanged

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, ProcessAccessLogs]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI log extraction failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/brain-bbqs-runners/dandi-usage-runner/actions/workflows/name-run+extraction_archive-dandi_runner-typhon_trigger-cron+dispatch_freq-daily.yml
