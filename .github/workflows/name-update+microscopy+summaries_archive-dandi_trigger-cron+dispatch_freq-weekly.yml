# Separate action for the gargantuan dataset of DANDI:000108
name: Update microscopy summaries
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  S3_LOG_BASE_PATH: ${{ vars.DANDI_S3_LOG_BASE_PATH }}
  ENV_PATH: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/${{ vars.S3LOGS_ENV_NAME }}"
  UV_PATH: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/uv"
  FLOCK_FILE: "${{ vars.DANDI_S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  # Requesters are geolocated while the summaries are generated, against the GeoLite2 database
  MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
  MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}

jobs:

  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Validate required variables
        run: |
          [ -n "${{ vars.DANDI_S3_LOG_BASE_PATH }}" ] || { echo "Repository variable DANDI_S3_LOG_BASE_PATH must be set."; exit 1; }
          [ -n "${{ vars.S3LOGS_ENV_NAME }}" ] || { echo "Repository variable S3LOGS_ENV_NAME must be set."; exit 1; }

      - name: Cancel if offline
        uses: CodyCBakerPhD/check-runner-action@v1
        with:
          labels: typhon,dandi
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateMicroscopySummaries:
    needs: CheckTyphon
    name: Update microscopy summaries
    runs-on: [self-hosted, typhon, dandi]
    timeout-minutes: 1600

    steps:
      - name: Update microscopy summaries
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v2
        with:
          command: update summaries
          flags: --pick 000108 --workers 1 --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache
          flock-file: ${{ env.FLOCK_FILE }}
          env-path: ${{ env.ENV_PATH }}
          uv-path: ${{ env.UV_PATH }}
          entrypoint: 'dandis3logextraction'

# Wait for the other summary updater to aggregate further

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, UpdateMicroscopySummaries]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "DANDI microscopy summary update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/brain-bbqs-runners/dandi-usage-runner/actions/workflows/name-update+microscopy+summaries_archive-dandi_trigger-cron+dispatch_freq-weekly.yml
